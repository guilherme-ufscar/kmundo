services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8300}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=10&pool_timeout=20
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - UPLOAD_DIR=/app/uploads
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_IMAP_PORT=${MAIL_IMAP_PORT}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - suite-network
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suite-network
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-56}
    volumes:
      - ./backups:/backups
      - ./docker/backup/backup.sh:/usr/local/bin/backup:ro
      - ./docker/backup/crontab:/etc/crontabs/root:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "-c", "sh /usr/local/bin/backup && exec crond -f -l 2"]
    networks:
      - suite-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: kmundo_postgres_data

networks:
  suite-network:
    driver: bridge
